name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc

    steps:
      - name: Validate release tag
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
              throw 'Expected a version tag such as v0.1.5.'
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check source
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The hosted Windows runner uses elevated Explorer. These fixtures need an unelevated desktop shell.
          $testArgs = @(
              'test', '--locked', '--',
              '--skip', 'processes::startup_program::tests::desktop_primary_token_is_read_only_unelevated_and_in_our_session',
              '--skip', 'processes::startup_program::tests::expandable_values_use_the_desktop_user_environment_but_reg_sz_stays_raw',
              '--skip', 'processes::startup_program::tests::shortcut_start_in_directory_is_expanded_validated_and_not_silently_discarded'
          )
          cargo @testArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\test-sensor-protocol.ps1

      - name: Build portable distribution
        run: .\scripts\build.ps1

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $package = .\scripts\package-release.ps1 -Tag $tag
          $title = "AnVir Next $tag"
          $existingJson = gh release view $tag --json isDraft,assets 2>$null
          if ($LASTEXITCODE -ne 0) {
              gh release create $tag $package.Archive --verify-tag --title $title --notes-file $package.Notes
              exit $LASTEXITCODE
          }

          $existing = $existingJson | ConvertFrom-Json
          if ($existing.isDraft) {
              gh release upload $tag $package.Archive --clobber
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              gh release edit $tag --draft=false --title $title --notes-file $package.Notes
              exit $LASTEXITCODE
          }
          if ($existing.assets.name -cnotcontains (Split-Path -Leaf $package.Archive)) {
              throw "Release $tag already exists without the expected ZIP."
          }
